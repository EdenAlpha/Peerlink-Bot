name: Read Android diagnostic test evidence
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Android CI run containing the retained emulator test results
        required: true
        type: string
permissions:
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: android-host-service-tests-api-*
          path: evidence
      - name: Print the complete assertion evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('evidence').rglob('*.xml'):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      print('FAILED_TEST', str(path), case.get('name'))
                      print((failure.get('message', '') + '\n' + (failure.text or ''))[:16000])
          PY
