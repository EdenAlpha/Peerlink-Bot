name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: 'Publish an already verified phone-test artifact from this CI run; do not rebuild'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_run_id == ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Keep test APK updates signed consistently
        uses: actions/cache@v4
        with:
          path: ~/.android/peerlink-engine-test.keystore
          key: peerlink-engine-test-debug-signing-v2

      - name: Prepare the dedicated test signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/peerlink-engine-test.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/peerlink-engine-test.keystore" \
              -storepass android -keypass android -alias AndroidDebugKey \
              -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Build APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest -PengineHostTestBuild=true --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk peerlink-debug.apk

      - name: Retain review APK
        uses: actions/upload-artifact@v4
        with:
          name: peerlink-phone-bot-test
          path: |
            peerlink-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # One PERMANENT release per build, named after the commit message, so
          # every version is listed separately and any older build can still be
          # installed. The old single rolling release destroyed that history.
          SHORT="${GITHUB_SHA:0:7}"
          TAG="build-${{ github.run_number }}-$SHORT"
          NAME="$(git log -1 --pretty=%s | tr -d '\r' | cut -c1-70)"
          {
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            git log -1 --pretty=%b | tr -d '\r' | cut -c1-1200
          } > release-notes.md

          gh release create "$TAG" peerlink-debug.apk \
            --target "$GITHUB_SHA" \
            --title "$NAME" \
            --notes-file release-notes.md \
            --prerelease

          # Convenience pointer only: always the newest build, overwritten.
          gh release delete "peerlink-debug-latest" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "peerlink-debug-latest" peerlink-debug.apk \
            --target "$GITHUB_SHA" \
            --title "PeerLink latest APK" \
            --notes "Newest build. Open the build-* releases for every earlier version." \
            --prerelease

  android-host-services:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the production host on genuine Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew :engine-host-tests:connectedDebugAndroidTest --stacktrace
      - name: Retain Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-host-service-tests
          path: engine-host-tests/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  publish-phone-test:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the verified test APK
        uses: actions/download-artifact@v4
        with:
          name: peerlink-phone-bot-test
          run-id: ${{ inputs.publish_run_id }}
          github-token: ${{ github.token }}
          path: phone-test
      - name: Publish a separate experimental test release
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_BUILD_RUN: ${{ inputs.publish_run_id }}
          TEST_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TEST_BUILD_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$TEST_REPOSITORY/actions/runs/$TEST_BUILD_RUN" --jq '.conclusion')" = success
          TEST_COMMIT=$(gh api "repos/$TEST_REPOSITORY/actions/runs/$TEST_BUILD_RUN" --jq '.head_sha')
          test -f phone-test/peerlink-debug.apk
          cat > phone-test-notes.md <<'NOTES'
          Experimental ARM64 PeerLink Test for the verified eFootball 11.1.1 engine.

          Android engine startup, all 44 database tables, own-controller detection and a 15-second startup hold were verified before publication.

          Phone-game P2P connection, kickoff and visible Pass response still require a real match test. This is a simple control test, not a complete autonomous player.

          Installs separately as PeerLink Test. The original game must already be installed; game binaries and assets are not bundled.
          NOTES
          gh release create "phone-engine-test-${TEST_COMMIT:0:7}" phone-test/peerlink-debug.apk \
            --repo "$TEST_REPOSITORY" --target "$TEST_COMMIT" --prerelease \
            --title 'PeerLink phone engine and controller test' --notes-file phone-test-notes.md
